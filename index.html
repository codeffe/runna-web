<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Runna</title>

<!-- ── Viewport ───────────────────────────────────────────────────────────
     viewport-fit=cover is what makes env(safe-area-inset-*) report real
     numbers on a notched iPhone; without it every inset is 0 and the header
     hides under the notch while the tab bar hides under the home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Runna — training plans, sessions and progress.">

<!-- ── iOS Home Screen ────────────────────────────────────────────────────
     Without apple-touch-icon the Home Screen shows a grey screenshot of the
     page instead of an app icon. black-translucent lets the app's own
     background run under the status bar (hence --safe-top everywhere). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runna">
<meta name="application-name" content="Runna">
<meta name="theme-color" content="#181B21">
<meta name="format-detection" content="telephone=no">
<meta name="apple-touch-fullscreen" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<script type="module" src="js/app.js"></script>
</head>
<body>

     the <use> shadow tree from the symbol itself, which is the only place
